name: Bundle and Publish Sources
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Check out existing published bundles
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check sources
        run: pnpm run typecheck

      - name: Bundle Paperback repository
        run: pnpm run bundle

      - name: Verify published artifacts
        run: pnpm run verify

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bundles
